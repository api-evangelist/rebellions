aid: rebellions
name: Rebellions
description: >-
  Rebellions is an AI infrastructure company that designs energy-efficient AI
  inference hardware (NPUs) and the software stack to deploy large language and
  multimodal models on it at scale. Its products include the Rebel100 inference
  chip (FP8, HBM3e), the ATOM-Max Server and POD, and RebelServer. The RBLN SDK
  compiles and serves HuggingFace Transformers/Diffusers, PyTorch, and
  TensorFlow models on RBLN accelerators, with integrations for vLLM, NVIDIA
  Triton, TorchServe, and Kubernetes. Rebellions does not expose a public
  REST/HTTP API; developers integrate through first-party Python SDKs
  (optimum-rbln, vllm-rbln), the RBLN compiler and driver, and the model zoo.
  Backed by Kindred Ventures and partnered with Samsung, Arm, IBM, and AWS.
