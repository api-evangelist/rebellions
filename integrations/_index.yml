# Rebellions integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in rebellions-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: rebellions-mlcommons-mlperf
  label: MLCommons MLPerf
  partner: mlcommons
  partner_name: MLCommons MLPerf
  category: ML benchmark results
  type: register
  channel: standard-directory
  evidence: https://github.com/mlcommons/inference_results_v3.0/tree/main/closed/rebellions
  source: edge
  relationship: standard-participant
  contract_reference:
    register: MLCommons MLPerf results (github.com/mlcommons/<family>_results_v<round>, closed/ + open/ submitter
      directories)
    spec_file: null
    standard: MLPerf (MLCommons)
    role: mlperf-submitter (lapsed)
    registered_name: Rebellions
    register_directories:
    - rebellions
    matched_domain: rebellions.ai
    matched_by: domain
    identity_source: wikidata Q131904558 'Rebellions' P856 https://rebellions.ai/
    identity_note: 'MLPerf publishes names only: domain from Wikidata P856 (labelled lookup, Kin 2026-10-15 decision
      1), then partner_link (domain + name check)'
    certified_products:
    - product: MLPerf Inference (closed division)
      newest_round: v3.0
      lapsed: true
    open_division_only: []
    current_window: each family's newest 2 rounds
    signal_note: certified_products = one entry per benchmark FAMILY with a closed-division (peer-reviewed, reference-rules)
      result, lapsed outside the current window; open-division families, rounds and result counts are context, never
      read
    detected_by: sweep-mlops.py
    detected: '2026-10-15'
  status: not-a-workflow
  arazzo: null
